<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>phonekeeb letter cards</title>
<!-- No theme dropdown here: the study page follows the device light or
     dark setting only. -->
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
<style>
/* Palette copied from the Light and Dark themes in themes.js (keep in
   sync), the same duplication style.css uses for the auto theme. */
:root { --bg: #fafafa; --panel: #ffffff; --fg: #111111; --muted: #777777; --line: #dddddd; }
@media (prefers-color-scheme: dark) {
  :root { --bg: #141414; --panel: #1c1c1c; --fg: #eeeeee; --muted: #999999; --line: #3a3a3a; }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: system-ui, sans-serif;
  padding: 12px calc(12px + env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) calc(12px + env(safe-area-inset-left));
}
header { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-bottom: 10px; }
h1 { font-size: 18px; margin: 0; }
a { color: var(--fg); }
label { font-size: 13px; color: var(--muted); display: inline-flex; align-items: center; gap: 6px; }
p.hint { font-size: 13px; color: var(--muted); max-width: 62ch; margin: 0 0 12px; }
#cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.card { margin: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px; }
.card svg { display: block; width: 100%; height: auto; }
figcaption { display: flex; justify-content: space-between; align-items: baseline; padding: 2px 6px 4px; }
figcaption b { font-size: 18px; }
figcaption span { font-size: 11px; color: var(--muted); }
/* SVG parts. The .hue-* color rules are generated by cards.js from
   themes.js; currentColor carries them into fills and strokes. */
.arm, .dead { stroke: var(--line); stroke-width: 1.5; fill: none; }
.wedge { fill: currentColor; opacity: 0.09; }
.preview { fill: var(--muted); font-size: 19px; text-anchor: middle; }
/* The halo keeps the letter readable where the stroke runs past it,
   which the one-crossing loop always does. */
.maplet { fill: currentColor; font-size: 15px; font-weight: 600; text-anchor: middle;
  stroke: var(--panel); stroke-width: 3px; stroke-linejoin: round; paint-order: stroke; }
.stroke { stroke: currentColor; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.start, .head { fill: currentColor; }
</style>
</head>
<body>
<header>
  <h1>Letter cards</h1>
  <a href="./">&larr; keyboard</a>
  <a href="game.html">practice</a>
  <label>Layout
    <!-- options are generated from the LAYOUTS registry in layouts.js -->
    <select id="layoutMode"></select>
  </label>
</header>
<p class="hint">One card per letter. The dot marks where the stroke
leaves the center circle. Follow the curve across the lines. The arrow
returns into the center and commits the letter. The tinted region and
the color name the region the stroke comes back from.</p>
<div id="cards"></div>

<!-- Same cache pinning as index.html: bump these ?v= numbers together
     with the ones there (grep "?v="). -->
<script type="importmap">
{
  "imports": {
    "./layout.js": "./layout.js?v=29",
    "./layouts.js": "./layouts.js?v=29",
    "./themes.js": "./themes.js?v=29",
    "./gesture-decoder.js": "./gesture-decoder.js?v=29",
    "./wheel-svg.js": "./wheel-svg.js?v=29"
  }
}
</script>
<script type="module" src="cards.js?v=29"></script>
</body>
</html>
