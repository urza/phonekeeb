<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>phonekeeb learned words</title>
<!-- No theme dropdown here: like the cards and practice pages, this one
     follows the device light or dark setting only. -->
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
<style>
/* Palette copied from the Light and Dark themes in themes.js (keep in
   sync), the same duplication style.css, cards.html and game.html use. */
:root {
  --bg: #fafafa; --panel: #ffffff; --fg: #111111; --muted: #777777; --line: #dddddd;
  --accent: #2b5fe3; --bad: #b3261e; --badbg: #fdecea; --ok: #1a7f4b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --panel: #1c1c1c; --fg: #eeeeee; --muted: #999999; --line: #3a3a3a;
    --accent: #5c86f5; --bad: #f2857c; --badbg: #2a1917; --ok: #52c98a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: system-ui, sans-serif; font-size: 15px;
  padding: 10px calc(10px + env(safe-area-inset-right)) calc(80px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
}
/* Phone-width column on a desktop window, the same rule style.css uses
   for the keyboard page (keep the 480 in sync). These pages are drawn
   for a phone, and a PC window is used to look at what the phone gets.
   The toast needs its own copy of this query; see the bottom of the
   file. */
@media (min-width: 520px) {
  body { max-width: 480px; margin: 0 auto; }
}
header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
h1 { font-size: 18px; margin: 0; flex: 1; }
a { color: var(--fg); text-decoration: none; font-size: 20px; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; }
.stats { font-size: 12px; color: var(--muted); margin: 0 0 10px; }

/* Search stays above the tabs and outside them on purpose: finding one
   bad word is the main reason this page gets opened, so the field must
   never be hidden inside a tab. */
#search {
  width: 100%; font: inherit; padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg);
  margin-bottom: 8px;
}
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.chip {
  padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--panel); color: var(--muted); font-size: 13px;
}
.chip[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }
.tabs .chip { font-size: 14px; padding: 8px 14px; }

/* rows */
.row { border-bottom: 1px solid var(--line); }
.rowhead {
  display: flex; align-items: center; gap: 10px; width: 100%;
  min-height: 44px; padding: 6px 2px; text-align: left;
}
.label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.label .start { color: var(--muted); }
.tag { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
.tag.warn { color: var(--bad); border-color: var(--bad); }
.count { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); min-width: 2.2em; text-align: right; }
/* The meter is the point of the list: it makes weight readable without
   reading any of the numbers. */
.meter { width: 56px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.meter i { display: block; height: 100%; background: var(--accent); }

.detail { padding: 4px 2px 12px; font-size: 13px; color: var(--muted); }
.detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; margin: 0 0 8px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; color: var(--fg); }
.detail .fix { color: var(--bad); }
.pairtitle { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-bottom: 3px; }
.pairlist { display: flex; flex-wrap: wrap; gap: 4px 8px; margin: 0 0 10px; }
.pairlist button { border-bottom: 1px dotted var(--line); color: var(--fg); }
.pairlist .n { color: var(--muted); font-size: 11px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions button, .actions label.file {
  padding: 9px 14px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel); font-size: 13px;
}
.actions button.danger { color: var(--bad); border-color: var(--bad); background: var(--badbg); }
.actions.bulk { padding: 4px 0 12px; }
.actions button[aria-pressed="true"] { color: var(--bg); background: var(--fg); border-color: var(--fg); }

/* recent feed */
.day { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 4px; }
.run { display: flex; flex-wrap: wrap; align-items: baseline; gap: 3px 5px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.time { font-size: 11px; color: var(--muted); width: 100%; }
.w { padding: 3px 2px; border-radius: 4px; }
.w.sus { color: var(--bad); text-decoration: underline dotted; }
.w[aria-expanded="true"] { background: var(--fg); color: var(--bg); }

.note { color: var(--muted); font-size: 12px; padding: 12px 2px; }

/* data panel */
.data { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; }
.data h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
.data .actions { margin-bottom: 10px; }
.data textarea {
  width: 100%; height: 140px; font-family: ui-monospace, monospace; font-size: 12px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
  color: var(--fg); padding: 8px;
}
.data label.file { display: inline-block; }
.data input[type=file] { display: none; }

/* Undo is what makes people willing to tap Delete at all, so it is
   pinned above the safe area and never scrolls out of reach. */
/* [hidden] must be restated: the UA stylesheet gives it display:none,
   and the author display:flex below would otherwise win and leave an
   empty toast parked on screen from the first paint. */
#toast[hidden] { display: none; }
#toast {
  position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom));
  display: flex; align-items: center; gap: 12px;
  background: var(--fg); color: var(--bg); border-radius: 10px; padding: 10px 14px;
  font-size: 13px; box-shadow: 0 4px 16px rgba(0, 0, 0, .25);
}
#toast span { flex: 1; }
#toast button { text-decoration: underline; font-weight: 600; padding: 4px; }
/* The toast is fixed to the window, so the desktop column has to be
   spelled out for it too. This block must stay BELOW the rule above:
   a media query adds no specificity, and both selectors are #toast, so
   only source order decides. 460 = 480 minus the body's two 10 px
   insets. */
@media (min-width: 520px) {
  #toast { left: 50%; right: auto; width: 460px; transform: translateX(-50%); }
}
</style>
</head>
<body>
<header>
  <a href="index.html" aria-label="Back to the keyboard">&larr;</a>
  <h1>Learned</h1>
  <button id="dataToggle" type="button" aria-expanded="false" aria-controls="dataPanel">&#9881;</button>
</header>
<p class="stats" id="stats"></p>

<div class="data" id="dataPanel" hidden>
  <h2>Your data</h2>
  <p class="stats" id="size"></p>
  <div class="actions">
    <button id="copyJson" type="button">Copy JSON</button>
    <button id="downloadJson" type="button">Download</button>
    <!-- A label wrapping the input is the whole file picker: a button
         plus a click() relay would break keyboard access for nothing. -->
    <label class="file">Import file
      <input id="importFile" type="file" accept="application/json,.json" /></label>
  </div>
  <div class="actions">
    <button id="clearLog" type="button" class="danger">Clear history</button>
    <button id="forgetAll" type="button" class="danger">Forget everything</button>
  </div>
  <details>
    <summary class="stats">Advanced: raw store</summary>
    <p class="stats">The whole store as JSON. Editing it by hand is the
    escape hatch for anything the lists above cannot reach.</p>
    <textarea id="raw" spellcheck="false"></textarea>
    <div class="actions">
      <button id="rawLoad" type="button">Load current</button>
      <button id="rawApply" type="button" class="danger">Replace store</button>
    </div>
    <p class="stats" id="rawMsg"></p>
  </details>
</div>

<input id="search" type="search" placeholder="Search words and phrases" autocomplete="off" />
<div class="chips tabs" id="tabs"></div>
<div class="chips" id="filters"></div>
<div id="list"></div>

<div id="toast" hidden><span id="toastMsg"></span><button id="toastUndo" type="button">Undo</button></div>

<!-- Same cache pinning as index.html: bump these ?v= numbers together
     with the ones there (grep "?v="). -->
<script type="importmap">
{
  "imports": {
    "./prediction.js": "./prediction.js?v=42",
    "./words-en.js": "./words-en.js?v=42",
    "./words-cs.js": "./words-cs.js?v=42"
  }
}
</script>
<script type="module" src="dictionary.js?v=42"></script>
</body>
</html>
