<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>phonekeeb prediction bench</title>
<!-- Device light or dark only, like the cards, game and dictionary pages. -->
<meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#141414" media="(prefers-color-scheme: dark)" />
<style>
/* Palette copied from the Light and Dark themes in themes.js (keep in
   sync), the same duplication the other pages use. */
:root {
  --bg: #fafafa; --panel: #ffffff; --fg: #111111; --muted: #777777; --line: #dddddd;
  --accent: #2b5fe3; --bad: #b3261e; --ok: #1a7f4b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #141414; --panel: #1c1c1c; --fg: #eeeeee; --muted: #999999; --line: #3a3a3a;
    --accent: #5c86f5; --bad: #f2857c; --ok: #52c98a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: system-ui, sans-serif; font-size: 15px;
  padding: 10px calc(10px + env(safe-area-inset-right)) calc(30px + env(safe-area-inset-bottom)) calc(10px + env(safe-area-inset-left));
}
@media (min-width: 520px) { body { max-width: 480px; margin: 0 auto; } }
header { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
h1 { font-size: 18px; margin: 0; flex: 1; }
a { color: var(--fg); text-decoration: none; font-size: 20px; }
button { font: inherit; color: inherit; background: none; border: none; padding: 0; }
p.note { font-size: 12px; color: var(--muted); margin: 0 0 10px; }
.actions { display: flex; gap: 8px; margin-bottom: 12px; }
.actions button {
  padding: 10px 16px; border-radius: 9px; border: 1px solid var(--line);
  background: var(--panel); font-size: 14px;
}
.actions button.go { background: var(--fg); color: var(--bg); border-color: var(--fg); }
#status { font-size: 13px; color: var(--accent); min-height: 1.2em; margin-bottom: 8px; }
section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
h2 { font-size: 13px; margin: 0 0 8px; font-weight: 600; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: right; padding: 3px 0; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
td.n { font-variant-numeric: tabular-nums; }
tr.slow td { color: var(--bad); }
tr.fast td.n:nth-child(2) { color: var(--ok); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
<header>
  <a href="index.html" aria-label="Back to the keyboard">&larr;</a>
  <h1>Prediction bench</h1>
</header>
<p class="note">The strip is drawn on every keystroke, so vocabulary size
is a latency question. This page measures it on the device that has to
run it. Put the phone on the charger and close other tabs first: a
throttled phone reads 2 to 3 times slower.</p>

<div class="actions">
  <button id="run" class="go" type="button">Run</button>
  <button id="copy" type="button">Copy results</button>
</div>
<p id="status"></p>
<div id="out"></div>

<!-- Same cache pinning as index.html: bump these ?v= numbers together
     with the ones there (grep "?v="). -->
<script type="importmap">
{
  "imports": {
    "./prediction.js": "./prediction.js?v=38",
    "./words-en.js": "./words-en.js?v=38",
    "./words-cs.js": "./words-cs.js?v=38",
    "./words-ext-en.js": "./words-ext-en.js?v=38",
    "./words-ext-cs.js": "./words-ext-cs.js?v=38",
    "./bigrams-en.js": "./bigrams-en.js?v=38",
    "./bigrams-cs.js": "./bigrams-cs.js?v=38",
    "./trigrams-en.js": "./trigrams-en.js?v=38",
    "./trigrams-cs.js": "./trigrams-cs.js?v=38"
  }
}
</script>
<script type="module" src="bench.js?v=38"></script>
</body>
</html>
